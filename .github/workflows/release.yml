name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'vite-plus tag'
        required: false
        default: ''
  schedule:
    - cron: '0 11 * * *'

permissions: {}

env:
  RELEASE_BUILD: 'true'
  DEBUG: 'napi:*'

jobs:
  check:
    name: Check version
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      version_changed: ${{ steps.check-build.outputs.changed }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Check Version
        id: get-version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version=$(curl -s https://api.github.com/repos/voidzero-dev/vite-plus/releases/latest | jq -r ".tag_name")
          fi
          echo "Current Version: ${version}"
          if [ -z "${version}" ] || [ "${version}" == "null" ]; then
            echo "Failed to get version"
            exit 1
          fi

          echo "version=${version/v/}" >> $GITHUB_ENV
          echo "version=${version/v/}" >> $GITHUB_OUTPUT

      - name: Check Build
        id: check-build
        run: |
          gh release view v${version} -R ${{ github.repository }} >/dev/null 2>&1 || echo "changed=true" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-rust:
    name: Build (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.os }}
    needs: check
    if: needs.check.outputs.version_changed == 'true'
    permissions:
      contents: read
    env:
      RELEASE_BUILD: 'true'
      DEBUG: 'napi:*'
      VERSION: ${{ needs.check.outputs.version }}
      cache-key: release
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: loongarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: loongarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: voidzero-dev/vite-plus
          ref: v${{ env.VERSION }}
      - uses: ./.github/actions/clone
      - uses: oxc-project/setup-rust@68c3199c5339f965e6e163924c3c450773eba42b # main (pending v1.0.17 — Swatinem/rust-cache v2.9.1 for node24)
        with:
          save-cache: ${{ github.ref_name == 'main' }}
          cache-key: ${{ env.cache-key }}

      - name: Install cross-compilation toolchain
        if: ${{ matrix.settings.target == 'loongarch64-unknown-linux-gnu' }}
        run: |
          sudo apt-get update
          sudo apt-get install g++-13-loongarch64-linux-gnu -y
          sudo update-alternatives \
            --install /usr/bin/loongarch64-linux-gnu-gcc loongarch64-linux-gnu-gcc /usr/bin/loongarch64-linux-gnu-gcc-13 100 \
            --slave /usr/bin/loongarch64-linux-gnu-gcc-ar loongarch64-linux-gnu-gcc-ar /usr/bin/loongarch64-linux-gnu-gcc-ar-13 \
            --slave /usr/bin/loongarch64-linux-gnu-gcc-nm loongarch64-linux-gnu-gcc-nm /usr/bin/loongarch64-linux-gnu-gcc-nm-13 \
            --slave /usr/bin/loongarch64-linux-gnu-gcc-ranlib loongarch64-linux-gnu-gcc-ranlib /usr/bin/loongarch64-linux-gnu-gcc-ranlib-13 \
            --slave /usr/bin/loongarch64-linux-gnu-gcov loongarch64-linux-gnu-gcov /usr/bin/loongarch64-linux-gnu-gcov-13
          sudo update-alternatives \
            --install /usr/bin/loongarch64-linux-gnu-g++ loongarch64-linux-gnu-g++ /usr/bin/loongarch64-linux-gnu-g++-13 100
          sudo update-alternatives \
            --install /usr/bin/loongarch64-linux-gnu-cpp loongarch64-linux-gnu-cpp /usr/bin/loongarch64-linux-gnu-cpp-13 100

      - name: Rustup Adds Target
        run: rustup target add ${{ matrix.settings.target }}

      - uses: oxc-project/setup-node@4c588e9266bd930b6ddc34307df0659ed511d187 # v1.3.1

      - name: Set build version
        shell: bash
        run: |
          set -euo pipefail
          # Stamp ${VERSION} as the [package] version so CARGO_PKG_VERSION matches
          # the version that gets published/installed (the release version, or
          # 0.0.0-commit.<sha> for pkg.pr.new). Anchored to the line-start
          # `version = "..."` so crate dependency versions are never touched.
          for f in crates/vite_global_cli/Cargo.toml packages/cli/binding/Cargo.toml; do
            node -e 'const fs=require("fs"),f=process.argv[1];fs.writeFileSync(f,fs.readFileSync(f,"utf8").replace(/^version = "[^"]*"/m,`version = "${process.env.VERSION}"`))' "$f"
          done
          # Stamp packages/cli/package.json too so the bundled JS dist inlines
          # ${VERSION} as cliPkg.version (VITE_PLUS_VERSION). Without this a preview
          # `vp migrate` pins the build-time release placeholder instead of the
          # test build, and skips the registry-bridge .npmrc.
          pnpm exec json-edit packages/cli/package.json '_.version = process.env.VERSION'

      - name: Verify version replacement
        shell: bash
        run: |
          set -euo pipefail
          for f in crates/vite_global_cli/Cargo.toml packages/cli/binding/Cargo.toml; do
            if ! grep -qF "version = \"${VERSION}\"" "$f"; then
              echo "ERROR: version stamp failed for $f"; head -5 "$f"; exit 1
            fi
          done
          if [ "$(node -p "require('./packages/cli/package.json').version")" != "${VERSION}" ]; then
            echo "ERROR: version stamp failed for packages/cli/package.json"; exit 1
          fi
          echo "Version stamp verified: ${VERSION}"

      - name: Update dependency for loongarch64 targets
        if: contains(matrix.settings.target, 'loongarch64')
        run: |
          echo '[patch.crates-io]' >> Cargo.toml
          echo 'nix = { git = "https://github.com/loong64/nix", branch = "loong64-v0.23.2" }' >> Cargo.toml
          cargo update -p nix@0.23.2
          if [ ${{ matrix.settings.target }} = 'loongarch64-unknown-linux-musl' ]; then
            echo 'oxc_resolver = { git = "https://github.com/loong64/oxc-resolver", branch = "loong64-v11.23.0" }' >> Cargo.toml
            cargo update -p oxc_resolver
          fi
          sed -i "s@TARGET_CC: clang@# TARGET_CC: clang@g" .github/actions/build-upstream/action.yml

      - name: Prepare build
        run: |
          wget -qO - https://github.com/${{ github.repository }}/raw/refs/heads/main/patch_loong64.patch | patch -p1
          VITE_TASK_COMMIT=$(grep "github.com/voidzero-dev/vite-task" Cargo.toml | awk -F'rev = "' '{print $2}' | cut -d'"' -f1 | uniq)
          sed -i "s@github.com/voidzero-dev/vite-task@github.com/loong64/vite-task@g" Cargo.toml
          sed -i "s@rev = \"${VITE_TASK_COMMIT}\"@branch = \"loong64-${VITE_TASK_COMMIT:0:7}\"@g" Cargo.toml

      - name: Build
        uses: ./.github/actions/build-upstream
        with:
          target: ${{ matrix.settings.target }}

      - name: Upload Vite+ native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vite-plus-native-${{ matrix.settings.target }}
          path: ./packages/cli/binding/*.node
          if-no-files-found: error

      - name: Upload Rust CLI binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vite-global-cli-${{ matrix.settings.target }}
          path: |
            ./target/${{ matrix.settings.target }}/release/vp
            ./target/${{ matrix.settings.target }}/release/vp.exe
            ./target/${{ matrix.settings.target }}/release/vp-shim.exe
          if-no-files-found: error

      - name: Package release archive
        shell: bash
        working-directory: ./target/${{ matrix.settings.target }}/release
        run: |
          if [ -f vp.exe ]; then
            7z a "vp-${{ matrix.settings.target }}.zip" vp.exe vp-shim.exe
          else
            tar -czf "vp-${{ matrix.settings.target }}.tar.gz" vp
          fi

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vp-release-archive-${{ matrix.settings.target }}
          path: |
            ./target/${{ matrix.settings.target }}/release/vp-*.tar.gz
            ./target/${{ matrix.settings.target }}/release/vp-*.zip
          if-no-files-found: error

      - name: Upload installer binary artifact (Windows only)
        if: contains(matrix.settings.target, 'windows')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vp-setup-${{ matrix.settings.target }}
          path: ./target/${{ matrix.settings.target }}/release/vp-setup.exe
          if-no-files-found: error

      - name: Remove .node files before upload dist
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}
        run: |
          rm ./packages/core/dist/**/*.node

      - name: Upload core dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}
        with:
          name: core
          path: ./packages/core/dist
          if-no-files-found: error

      - name: Upload prompts dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}
        with:
          name: prompts
          path: ./packages/prompts/dist
          if-no-files-found: error

      - name: Upload cli dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}
        with:
          name: cli
          path: ./packages/cli/dist
          if-no-files-found: error

      - name: Upload cli docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}
        with:
          name: cli-docs
          path: ./packages/cli/docs
          if-no-files-found: error

      - name: Upload LICENSE files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-gnu' }}
        with:
          name: licenses
          path: |
            ./packages/core/LICENSE
            ./packages/cli/LICENSE
          if-no-files-found: error

  Release:
    runs-on: ubuntu-latest
    # environment: release
    needs: [check, build-rust]
    if: needs.check.outputs.version_changed == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write # Required for OIDC
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: voidzero-dev/vite-plus
          ref: v${{ env.VERSION }}
      - uses: ./.github/actions/clone

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare build
        run: |
          wget -qO - https://github.com/${{ github.repository }}/raw/refs/heads/main/patch_loong64.patch | patch -p1
          sed -i 's@npm publish@npm pack@g' packages/cli/publish-native-addons.ts

      - name: Install dependencies
        run: pnpm install

      - name: Download cli dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/cli/dist
          pattern: cli
          merge-multiple: true

      - name: Download cli docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/cli/docs
          pattern: cli-docs
          merge-multiple: true

      - name: Download cli binding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/cli/artifacts
          pattern: vite-plus-native-*

      - name: Download core dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/core/dist
          pattern: core
          merge-multiple: true

      - name: Download LICENSE files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages
          pattern: licenses
          merge-multiple: true

      - uses: ./.github/actions/download-rolldown-binaries
        with:
          github-token: ${{ github.token }}
          target: x86_64-unknown-linux-gnu
          upload: 'false'

      - name: Download Rust CLI binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: rust-cli-artifacts
          pattern: vite-global-cli-*

      - name: Download installer binaries (Windows)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installer-artifacts
          pattern: vp-setup-*

      - name: Prepare installer binaries for release
        run: |
          mkdir -p installer-release
          for artifact_dir in installer-artifacts/vp-setup-*/; do
            if [ -d "$artifact_dir" ]; then
              dir_name=$(basename "$artifact_dir")
              target_name=${dir_name#vp-setup-}
              cp "$artifact_dir/vp-setup.exe" "installer-release/vp-setup-${target_name}.exe"
            fi
          done
          echo "Installer binaries:"
          ls -la installer-release/ || echo "No installer binaries found"

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: binary-release
          pattern: vp-release-archive-*
          merge-multiple: true

      - name: 'Setup npm'
        run: npm install -g npm@latest

      - name: Prepare and publish native addons
        run: node ./packages/cli/publish-native-addons.ts --mode npm

      - name: Publish
        run: |
          pnpm publish --filter=./packages/core --tag latest --access public --no-git-checks --dry-run --force
          pnpm publish --filter=./packages/cli --tag latest --access public --no-git-checks --dry-run --force

      - name: Make artifacts
        run: |
          mkdir -p release-assets
          find packages/cli/npm packages/cli/cli-npm -name "*.tgz" -exec mv {} release-assets/ \;
          ls -lh release-assets/

      - name: Create release body
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          INSTALL_BASH="curl -fsSL https://vite.plus | bash"
          INSTALL_PS1="irm https://vite.plus/ps1 | iex"
          cat > ./RELEASE_BODY.md <<EOF
          ## vite-plus v${VERSION}

          ### Published Packages

          - \`@voidzero-dev/vite-plus-core@${VERSION}\`
          - \`vite-plus@${VERSION}\`

          ### Installation

          **macOS/Linux:**
          \`\`\`bash
          ${INSTALL_BASH}
          \`\`\`

          **Windows:**
          \`\`\`powershell
          ${INSTALL_PS1}
          \`\`\`

          Or download and run \`vp-setup.exe\` from the assets below.

          View the full commit: https://github.com/${REPOSITORY}/commit/${COMMIT_SHA}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        id: release
        with:
          body_path: ./RELEASE_BODY.md
          draft: true
          make_latest: true
          prerelease: false
          name: vite-plus v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            installer-release/vp-setup-*.exe
            binary-release/vp-*.tar.gz
            binary-release/vp-*.zip
            release-assets/*.tgz

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${VERSION}" --draft=false --repo "${{ github.repository }}"

  # Build and push the official toolchain Docker image to GHCR after the npm
  # release is published (the image installs vp from npm, so the version must
  # exist first). See docker/Dockerfile and docs/guide/docker.md.
  Publish:
    runs-on: ubuntu-latest
    # environment: release
    needs: [check, build-rust]
    if: needs.check.outputs.version_changed == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write # Required for OIDC
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: voidzero-dev/vite-plus
          ref: v${{ env.VERSION }}
      - uses: ./.github/actions/clone

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare build
        run: |
          wget -qO - https://github.com/${{ github.repository }}/raw/refs/heads/main/patch_loong64.patch | patch -p1
          sed -i 's#git+https://github.com/voidzero-dev/vite-plus#git+https://github.com/loong64/vite-plus#g' packages/cli/package.json packages/core/package.json packages/prompts/package.json
          sed -i 's#"name": "@voidzero-dev/"#"name": "@loong64/"#g' packages/core/package.json packages/prompts/package.json
          sed -i 's#"name": "vite-plus",#"name": "@loong64/vite-plus",#g' packages/cli/package.json
          sed -i 's#"packageName": "@voidzero-dev/#"packageName": "@loong64/#g' packages/cli/package.json
          sed -i 's#@voidzero-dev/vite-plus-cli#@loong64/vite-plus-cli#g' packages/cli/publish-native-addons.ts

      - name: Install dependencies
        run: pnpm install

      - name: Download cli dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/cli/dist
          pattern: cli
          merge-multiple: true

      - name: Download cli docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/cli/docs
          pattern: cli-docs
          merge-multiple: true

      - name: Download cli binding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/cli/artifacts
          pattern: vite-plus-native-*

      - name: Download core dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/core/dist
          pattern: core
          merge-multiple: true

      - name: Download LICENSE files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages
          pattern: licenses
          merge-multiple: true

      - uses: ./.github/actions/download-rolldown-binaries
        with:
          github-token: ${{ github.token }}
          target: x86_64-unknown-linux-gnu
          upload: 'false'

      - name: Download Rust CLI binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: rust-cli-artifacts
          pattern: vite-global-cli-*

      - name: Download installer binaries (Windows)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installer-artifacts
          pattern: vp-setup-*

      - name: Prepare installer binaries for release
        run: |
          mkdir -p installer-release
          for artifact_dir in installer-artifacts/vp-setup-*/; do
            if [ -d "$artifact_dir" ]; then
              dir_name=$(basename "$artifact_dir")
              target_name=${dir_name#vp-setup-}
              cp "$artifact_dir/vp-setup.exe" "installer-release/vp-setup-${target_name}.exe"
            fi
          done
          echo "Installer binaries:"
          ls -la installer-release/ || echo "No installer binaries found"

      - name: 'Setup npm'
        run: npm install -g npm@latest

      - name: Setup NPM token
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Prepare and publish native addons
        run: node ./packages/cli/publish-native-addons.ts --mode npm

      - name: Publish
        run: |
          pnpm publish --filter=./packages/core --tag latest --access public --no-git-checks
          pnpm publish --filter=./packages/cli --tag latest --access public --no-git-checks
